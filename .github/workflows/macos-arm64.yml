name: macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-arm64-proxy

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --no-fix
      - run: npm test
      - run: npm run electron:build:mac:arm64
      - name: Verify arm64 application and signature
        run: |
          APP="dist_electron/mac-arm64/Translate Desktop.app"
          test "$(lipo -archs "$APP/Contents/MacOS/Translate Desktop")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil verify dist_electron/*-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Translate-Desktop-mac-arm64
          path: |
            dist_electron/*-mac-arm64.dmg
            dist_electron/*-mac-arm64.zip
          if-no-files-found: error
